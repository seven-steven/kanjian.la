name: Validate navigation content

on:
  pull_request:
    branches: [jekyll]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate navigation data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.1"
          bundler-cache: false
      - name: Run every Node test file
        run: |
          set -euo pipefail
          find .github/scripts -type f -name '*.test.js' -print0 | sort -z | xargs -0 -r node --test
      - name: Run every Ruby test file
        run: |
          set -euo pipefail
          find test -type f -name '*_test.rb' -print0 | sort -z | xargs -0 -r -n1 ruby
      - name: Validate site data
        run: ruby scripts/validate_sites.rb
      - name: Build Jekyll site in Docker
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/srv/jekyll" \
            -v "$GITHUB_WORKSPACE/_site:/srv/jekyll/_site" \
            jekyll/builder:4.2.0 /bin/bash -c 'chmod 777 /srv/jekyll && command -v jekyll && jekyll --version && jekyll build --future'
