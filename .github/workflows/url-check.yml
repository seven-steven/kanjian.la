name: URL check

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "_data/sites.yml"
      - "scripts/check_urls.rb"
      - "test/check_urls_test.rb"
      - ".github/workflows/url-check.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: url-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.1"
      - name: Run URL checker unit tests
        run: ruby -Itest test/check_urls_test.rb
      - name: Check external URLs
        run: ruby scripts/check_urls.rb --output url-check.json --timeout 10 --retries 2
      - name: Synchronize per-URL issues
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v7.0.1
        env:
          RESULTS_FILE: url-check.json
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const payload = JSON.parse(fs.readFileSync(process.env.RESULTS_FILE, 'utf8'));
            const { results } = payload;
            const checkedAt = payload.checked_at;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const markerFor = (key) => `<!-- url-check:${key} -->`;
            // Mirrors the Ruby UrlCheck.key_for fallback: when normalize could not
            // canonicalize a URL (previously the case for Internationalized Domain
            // Names), the key was derived from the raw URL string. After IDN
            // support landed, those URLs canonicalize to Punycode and produce a
            // different key, so legacy issues are matched via this fallback key.
            const legacyKeyFor = (kind, rawUrl) =>
              crypto.createHash('sha256').update(`${kind}:${rawUrl}`).digest('hex').slice(0, 20);
            const statePattern = /<!-- url-check-state:(\{[^\n]*\}) -->/g;
            const stateCapturePattern = /<!-- url-check-state:(\{[^\n]*\}) -->/;
            const stateFor = (issue, key, item) => {
              const match = issue?.body?.match(stateCapturePattern);
              if (!match) return 1;
              try {
                const state = JSON.parse(match[1]);
                const matches = state.v === 1 && state.key === key &&
                  state.kind === item.kind && state.normalized_url === item.normalized_url &&
                  Number.isInteger(state.consecutive_failures) && state.consecutive_failures > 0;
                return matches ? state.consecutive_failures + 1 : 1;
              } catch (_error) {
                return 1;
              }
            };
            const stateMarkerFor = (key, item, consecutiveFailures) => `<!-- url-check-state:${JSON.stringify({
              v: 1,
              key,
              kind: item.kind,
              normalized_url: item.normalized_url,
              consecutive_failures: consecutiveFailures,
              checked_at: checkedAt,
              run_id: String(context.runId),
              category: item.category,
              status: item.status ?? null,
              error: item.error ?? null
            })} -->`;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${context.runId}`;
            const requiredLabels = [
              ['url-check', 'd73a4a'],
              ['automated', '1d76db'],
              ['needs-review', 'fbca04']
            ];
            const accessibleStatuses = new Set([401, 403, 429]);
            const isHealthy = (item) =>
              ['ok', 'redirect'].includes(item.category) || accessibleStatuses.has(item.status);
            const referenceFor = (item) => {
              const head = `- \`${item.path || 'unknown path'}\` — ${item.title || '(untitled)'} (${item.kind}): ${item.url}`;
              const category = item.site_category || '(unknown category)';
              if (item.kind === 'icon') {
                const site = item.site_title || '(unknown site)';
                const main = item.site_url ? `（主链接：${item.site_url}）` : '';
                return `${head}\n  - 属于站点：${site}${main}\n  - 分类：${category}`;
              }
              return `${head}\n  - 站点：${item.site_title || item.title || '(untitled)'}\n  - 分类：${category}`;
            };
            const references = (items) => items.map(referenceFor).join('\n');
            const failureBody = (key, items, consecutiveFailures) => {
              const primary = items.find((item) => !isHealthy(item)) || items[0];
              const approval = primary.kind === 'main' && consecutiveFailures >= 3
                ? 'Eligible for owner approval: add the `agent:approved` label to create a removal PR.'
                : 'Automatic removal requires a main URL to fail 3 consecutive checks.';
              return [
                markerFor(key),
                stateMarkerFor(key, primary, consecutiveFailures),
                'Automated URL check detected a failure.',
                '',
                '## References',
                references(items),
                '',
                '## Latest result',
                `- Consecutive failures: ${consecutiveFailures}/3`,
                `- Category: ${primary.category}`,
                `- Status: ${primary.status ?? 'n/a'}`,
                `- Error: ${primary.error ?? 'n/a'}`,
                `- Normalized URL: ${primary.normalized_url}`,
                `- Final URL: ${primary.final_url ?? 'n/a'}`,
                '',
                approval,
                '',
                `[View this Actions run](${runUrl})`
              ].join('\n');
            };
            const resetFailureState = async (issue) => {
              if (!issue?.body?.match(stateCapturePattern)) return;
              const body = issue.body.replace(statePattern, '').replace(/\n{3,}/g, '\n\n').trim();
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, body });
            };
            const commentAndClose = async (issue, comment, alwaysComment = false) => {
              if (!issue) return;
              if (alwaysComment || issue.state === 'open') {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: comment });
              }
              if (issue.state === 'open') {
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
              }
            };

            for (const [name, color] of requiredLabels) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name, color });
              }
            }

            const issues = (await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', per_page: 100, labels: 'url-check'
            })).filter((issue) => !issue.pull_request && issue.user?.login === 'github-actions[bot]');
            const currentByKey = new Map();
            for (const item of results) {
              const grouped = currentByKey.get(item.key) || [];
              grouped.push(item);
              currentByKey.set(item.key, grouped);
            }
            const issuesByKey = new Map();
            for (const issue of issues) {
              const markers = [...(issue.body || '').matchAll(/<!-- url-check:([a-f0-9]{20}) -->/g)];
              const states = [...(issue.body || '').matchAll(statePattern)];
              if (markers.length !== 1 || states.length > 1) continue;
              const key = markers[0][1];
              if (states.length === 1) {
                try {
                  const state = JSON.parse(states[0][1]);
                  if (state.v !== 1 || state.key !== key ||
                      !['main', 'icon'].includes(state.kind) ||
                      typeof state.normalized_url !== 'string') continue;
                } catch (_error) {
                  continue;
                }
              }
              const grouped = issuesByKey.get(key) || [];
              grouped.push(issue);
              issuesByKey.set(key, grouped);
            }

            const issueMap = new Map();
            for (const [key, duplicates] of issuesByKey) {
              duplicates.sort((left, right) => left.number - right.number);
              const [earliest, ...later] = duplicates;
              issueMap.set(key, earliest);
              for (const duplicate of later) {
                await commentAndClose(
                  duplicate,
                  `Duplicate of #${earliest.number}; retaining the earliest URL check issue for this key.\n\n[View this Actions run](${runUrl})`,
                  true
                );
              }
            }

            // Migrate issues that were filed under a legacy raw-URL key (before IDN
            // support) to their current canonical Punycode key. A canonical key is
            // only allowed to claim a legacy issue when it has no direct issue yet,
            // so direct matches always win over migration. Each canonical key
            // probes the legacy keys of every URL it groups, since several raw
            // URLs can canonicalize to the same Punycode key.
            const migratedIssueNumbers = new Set();
            for (const [canonicalKey, items] of currentByKey) {
              if (issueMap.has(canonicalKey)) continue;
              const legacyKeys = new Set(items.map((item) => legacyKeyFor(item.kind, item.url)));
              legacyKeys.delete(canonicalKey);
              const claim = [...legacyKeys]
                .map((lk) => issueMap.get(lk))
                .find((candidate) => candidate && !migratedIssueNumbers.has(candidate.number));
              if (!claim) continue;
              issueMap.set(canonicalKey, claim);
              for (const lk of legacyKeys) issueMap.delete(lk);
              migratedIssueNumbers.add(claim.number);
            }

            for (const [key, issue] of issueMap) {
              if (!currentByKey.has(key)) {
                await commentAndClose(
                  issue,
                  `This URL has been removed from navigation and is no longer checked.\n\n[View this Actions run](${runUrl})`
                );
              }
            }

            for (const [key, items] of currentByKey) {
              const issue = issueMap.get(key);
              const wasMigrated = issue && migratedIssueNumbers.has(issue.number);
              if (items.every(isHealthy)) {
                await resetFailureState(issue);
                const recoveryNote = wasMigrated
                  ? `URL check recovered; the URL is reachable again. This issue was matched via its legacy Unicode-URL key after IDN (Punycode) canonicalization.\n\n[View this Actions run](${runUrl})`
                  : `URL check recovered; the URL is reachable again.\n\n[View this Actions run](${runUrl})`;
                await commentAndClose(issue, recoveryNote);
                continue;
              }

              const primary = items.find((item) => !isHealthy(item)) || items[0];
              // stateFor compares the stored state against the canonical key and
              // Punycode normalized_url; a migrated issue's legacy state never
              // matches, so its failure count correctly restarts at 1 instead of
              // inheriting the spurious invalid_url tally from before the fix.
              const consecutiveFailures = stateFor(issue, key, primary);
              const body = failureBody(key, items, consecutiveFailures);
              if (issue) {
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'open', body });
              } else {
                const created = await github.rest.issues.create({
                  owner,
                  repo,
                  title: `[URL Check] ${items[0].title || items[0].url}`,
                  body,
                  labels: requiredLabels.map(([name]) => name)
                });
                issueMap.set(key, created.data);
              }
            }
