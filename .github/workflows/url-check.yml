name: URL check

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "_data/sites.yml"
      - "scripts/check_urls.rb"
      - "scripts/safe_network.rb"
      - "scripts/url_issue_state.rb"
      - "scripts/remove_failed_url.rb"
      - "test/check_urls_test.rb"
      - "test/safe_network_test.rb"
      - "test/url_issue_state_test.rb"
      - "test/remove_failed_url_test.rb"
      - ".github/scripts/url_failure_counter.js"
      - ".github/scripts/url_failure_counter.test.js"
      - ".github/scripts/url_issue_sync.js"
      - ".github/scripts/url_issue_sync.test.js"
      - ".github/workflows/url-check.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: url-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    # URL availability checks/tests can run on every ref. Persistent failure state
    # and GitHub issue mutations remain authoritative exclusively on the default
    # branch, so a manual run from another branch cannot pollute those records.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Restore failure counter cache
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: failure-cache
        uses: actions/cache/restore@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: .url-check-state/
          key: url-check-failure-state-v2-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            url-check-failure-state-v2-${{ github.ref }}-
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.1"
      - name: Run URL checker unit tests
        run: ruby -Itest test/check_urls_test.rb
      - name: Run failure counter unit tests
        run: node --test .github/scripts/url_failure_counter.test.js
      - name: Run issue synchronization unit tests
        run: node --test .github/scripts/url_issue_sync.test.js
      - name: Check external URLs
        run: ruby scripts/check_urls.rb --output url-check.json --timeout 10 --retries 2
      - name: Synchronize per-URL issues
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v7.0.1
        env:
          RESULTS_FILE: url-check.json
          FAILURE_STATE_FILE: .url-check-state/failure-counts.json
        with:
          script: |
            const path = require('path');
            const sync = require(path.join(process.env.GITHUB_WORKSPACE, '.github', 'scripts', 'url_issue_sync.js'));
            await sync.synchronizeIssues({
              github,
              core,
              context,
              resultsFile: process.env.RESULTS_FILE,
              failureStateFile: process.env.FAILURE_STATE_FILE,
              serverUrl: process.env.GITHUB_SERVER_URL
            });
      - name: Save failure counter cache
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && success() && steps.failure-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: .url-check-state/
          key: ${{ steps.failure-cache.outputs.cache-primary-key }}
