name: Enforce navigation agent PR scope

on:
  pull_request:
    branches: [jekyll]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  enforce-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.1"
          bundler-cache: false
      - name: Validate agent pull request through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.event.repository.owner.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          pr_json="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          head_ref="$(jq -r '.head.ref' <<<"$pr_json")"

          if [[ "$head_ref" =~ ^agent/issue-([1-9][0-9]*)$ ]]; then
            request_type='navigation'
            issue_number="${BASH_REMATCH[1]}"
            expected_title="chore(navigation): process issue #$issue_number"
          elif [[ "$head_ref" =~ ^agent/url-check-issue-([1-9][0-9]*)$ ]]; then
            request_type='url-check'
            issue_number="${BASH_REMATCH[1]}"
          else
            printf 'Non-agent PR; scope validation skipped.\n'
            exit 0
          fi

          test "$(jq -r '.base.ref' <<<"$pr_json")" = 'jekyll'
          test "$(jq -r '.base.repo.full_name' <<<"$pr_json")" = "$REPOSITORY"
          test "$(jq -r '.head.repo.full_name' <<<"$pr_json")" = "$REPOSITORY"
          test "$(jq -r '.head.repo.owner.login' <<<"$pr_json")" = "$REPOSITORY_OWNER"

          issue_json="$(gh api "repos/$REPOSITORY/issues/$issue_number")"
          test "$(jq -r '.state' <<<"$issue_json")" = 'open'
          jq -e '.labels | any(.name == "agent:approved")' <<<"$issue_json" >/dev/null
          if [[ "$request_type" == 'navigation' ]]; then
            test "$(jq -r '.title' <<<"$pr_json")" = "$expected_title"
            test "$(jq -r '.user.login' <<<"$issue_json")" = "$REPOSITORY_OWNER"
            jq -e '.labels | any(.name == "navigation-request")' <<<"$issue_json" >/dev/null
          else
            expected_removed_logo=''
            pr_title="$(jq -r '.title' <<<"$pr_json")"
            case "$pr_title" in
              "chore(navigation): promote replacement for URL issue #$issue_number")
                expected_outcome='promoted'
                ;;
              "chore(navigation): remove failed URL from issue #$issue_number")
                expected_outcome='removed'
                ;;
              *)
                printf 'Unexpected URL-check PR title: %s\n' "$pr_title" >&2
                exit 1
                ;;
            esac
            test "$(jq -r '.user.login' <<<"$issue_json")" = 'github-actions[bot]'
            jq -e '.labels | any(.name == "url-check")' <<<"$issue_json" >/dev/null
            jq -e '.labels | any(.name == "automated")' <<<"$issue_json" >/dev/null
            jq -e '.body | test("(?m)^<!-- url-check:[a-f0-9]{20} -->$")' <<<"$issue_json" >/dev/null
            jq -e '.body | test("(?m)^<!-- url-check-state:\\{.*\\} -->$")' <<<"$issue_json" >/dev/null
            printf '%s' "$(jq -r '.body' <<<"$issue_json")" > /tmp/url-issue-body
            gh api "repos/$REPOSITORY/contents/_data/sites.yml?ref=jekyll" --jq '.content' | tr -d '\n' | base64 --decode > /tmp/base-sites.yml
            cp _data/sites.yml /tmp/pr-sites.yml
            # Replay the deterministic delivery against the BASE sites.yml in an
            # isolated logo directory. The PR title fixes which deterministic
            # checker scenario applies: promotion keeps replacement candidates
            # healthy; removal keeps them unhealthy. In either scenario the
            # Issue-marked URL remains a 404. Base logo names make the replay's
            # orphan decision match navigation-agent.yml.
            scope_logo_dir="$(mktemp -d)"
            git fetch --no-tags origin jekyll
            git ls-tree -r --name-only origin/jekyll -- assets/image/logo/ |
              while IFS= read -r path; do
                name="${path#assets/image/logo/}"
                test "$name" = "$(basename "$name")" || continue
                : >"$scope_logo_dir/$name"
              done
            expected_delivery_logo="$(EXPECTED_OUTCOME="$expected_outcome" ruby -I. -r ./scripts/remove_failed_url -e '
              class ScopeChecker
                def initialize(state, expected_outcome)
                  @state = state
                  @expected_outcome = expected_outcome
                end

                def check(entry)
                  normalized = UrlCheck.normalize(entry.fetch("url"))
                  if entry.fetch("kind") == @state.fetch("kind") &&
                     normalized == @state.fetch("normalized_url") &&
                     UrlCheck.key_for(entry.fetch("kind"), normalized) == @state.fetch("key")
                    { "category" => "client_error", "status" => 404 }
                  elsif @expected_outcome == "promoted"
                    { "category" => "ok", "status" => 200 }
                  else
                    { "category" => "client_error", "status" => 404 }
                  end
                rescue URI::InvalidURIError
                  { "category" => "invalid_url", "status" => nil }
                end
              end
              issue_body = File.read("/tmp/url-issue-body")
              state = UrlIssueState.parse_issue(issue_body)
              expected_outcome = ENV.fetch("EXPECTED_OUTCOME")
              result = UrlRemovalProcessor.new(
                issue_body: issue_body,
                sites_path: "/tmp/base-sites.yml",
                logo_dir: "'"$scope_logo_dir"'",
                checker: ScopeChecker.new(state, expected_outcome)
              ).call
              outcome = result.fetch("result")
              abort result.fetch("message") unless outcome == expected_outcome
              print result.fetch("removed_logo", "")
            ')"
            expected_removed_logo="$expected_delivery_logo"
            cmp /tmp/base-sites.yml /tmp/pr-sites.yml
          fi

          # Pull each changed file with its GitHub status (added/removed/modified)
          # so URL-removal PRs can be constrained to at most one logo DELETION.
          gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[] | "\(.status)\t\(.filename)"' > /tmp/changed-files
          test -s /tmp/changed-files
          # URL-removal PRs may delete only the single orphan logo the processor
          # computed (if any); every other logo change is rejected. Navigation
          # PRs still allow adds/edits of direct logo children.
          expected_removed_logo="${expected_removed_logo-}"
          url_logo_deletions=0
          while IFS=$'\t' read -r status path; do
            case "$path" in
              _data/sites.yml) ;;
              assets/image/logo/*)
                test "${path#assets/image/logo/}" = "$(basename "$path")" || {
                  printf 'Agent logo must be a direct child: %s\n' "$path" >&2
                  exit 1
                }
                if [[ "$request_type" == 'url-check' ]]; then
                  logo_name="${path#assets/image/logo/}"
                  if [[ "$status" != 'removed' ]]; then
                    printf 'URL removal PR may only delete a logo, not %s it: %s\n' "$status" "$path" >&2
                    exit 1
                  fi
                  if [[ -z "$expected_removed_logo" ]]; then
                    printf 'URL removal PR deleted a logo the processor did not orphan: %s\n' "$path" >&2
                    exit 1
                  fi
                  if [[ "$logo_name" != "$expected_removed_logo" ]]; then
                    printf 'URL removal PR deleted the wrong logo: %s (expected %s)\n' "$logo_name" "$expected_removed_logo" >&2
                    exit 1
                  fi
                  url_logo_deletions=$((url_logo_deletions + 1))
                fi
                ;;
              *)
                printf 'Disallowed agent PR path: %s\n' "$path" >&2
                exit 1
                ;;
            esac
          done < /tmp/changed-files
          if [[ "$request_type" == 'url-check' && "$url_logo_deletions" -gt 1 ]]; then
            printf 'URL removal PR may delete at most one logo; found %s.\n' "$url_logo_deletions" >&2
            exit 1
          fi
