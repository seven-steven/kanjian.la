  <!-- 5-stop 水平渐变 #FF501E→#FCB736, 笔画 72px 圆头。原图噪点/交叉处压暗为位图伪影,未复刻。 -->
  <defs>
    <linearGradient id="w-fill" gradientUnits="userSpaceOnUse" x1="285" y1="0" x2="738" y2="0">
      <stop offset="0" stop-color="#FF501E"/>
      <stop offset="0.254" stop-color="#F67028"/>
      <stop offset="0.501" stop-color="#FC8E32"/>
      <stop offset="0.746" stop-color="#FCAD47"/>
      <stop offset="1" stop-color="#FCB736"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="229" fill="#20272F"/>
  <path d="M285 360 C334 540 353 665 400 665 C444 665 497 444 512 444 C527 444 579 665 623 665 C669 665 689 540 738 360"
        fill="none" stroke="url(#w-fill)" stroke-width="72" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
