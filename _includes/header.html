<header>
  <div class="header">
    <button class="menu-toggle" id="menu-toggle" type="button" aria-label="打开导航菜单"
      aria-expanded="false" aria-controls="site-nav">
      <span class="ri-menu-fill" aria-hidden="true"></span>
    </button>
  </div>
  <nav id="site-nav" class="blur">
    <ul class="nav">
      {% for category in site.data.sites %}
      {% if category.sub %}
      <li class="nav-sub-container">
        <a href="javascript:void(0)">
          {% else %}
      <li>
        <a href="#{{ category.name | remove: ' ' }}">
          {% endif %}
          <span class="nav-icon {{ category.icon }}"></span>
          {{ category.name }}
          {% if category.sub %}
          <span class="ri-arrow-right-s-line"></span>
          {% endif %}
        </a>
        {% if category.sub %}
        <ul class="nav blur">
          {% for sub_category in category.sub %}
          <li>
            <a href="#{{ category.name | remove: ' ' }}-{{ sub_category.name | remove: ' ' }}">{{ sub_category.name }}</a>
          </li>
          {% endfor %}
        </ul>
        {% endif %}
      </li>
      {% endfor %}
    </ul>
  </nav>
</header>
